<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입금</title>
</head>
<body>

<h2>입금</h2>

<div>
    <label>계좌번호</label>
    <input type="text" id="acctNo" value="1234567890">
</div>

<div>
    <label>고객명</label>
    <input type="text" id="custNm" value="홍길동">
</div>

<div>
    <label>입금금액</label>
    <input type="text" id="amount" value="150000">
</div>

<br>
<button onclick="fnConfirm()">확인</button>

<hr>

<div id="result"></div>

<script>
function fnConfirm() {

    // 1. 입력값 검증
    if (!fnValidate()) return;

    // 2. 값 꺼내기
    var param = {
        acctNo : document.getElementById("acctNo").value,
        custNm : document.getElementById("custNm").value,
        amount : document.getElementById("amount").value
    };

    // 3. 서버 호출
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/deposit", true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
        if (xhr.status != 200) {
            alert("서버 통신에 실패했습니다.");
            return;
        }
        var res = JSON.parse(xhr.responseText);
        if (!res.success) {
            alert(res.message + "\n(" + res.code + ")");
            return;
        }
        fnSuccess(res.data);
    };

    xhr.send(JSON.stringify(param));
}


// ★ 화면 검증
function fnValidate() {

    var acctNo = document.getElementById("acctNo");
    var custNm = document.getElementById("custNm");
    var amount = document.getElementById("amount");

    if (!fnRequired(acctNo, "계좌번호")) return false;
    if (!fnNumeric(acctNo, "계좌번호"))  return false;

    if (!fnRequired(custNm, "고객명"))   return false;

    if (!fnRequired(amount, "입금금액")) return false;
    if (!fnNumeric(amount, "입금금액"))  return false;

    if (Number(amount.value) <= 0) {
        alert("입금금액은 0보다 커야 합니다.");
        amount.focus();
        return false;
    }

    return true;
}

function fnRequired(el, name) {
    if (el.value == null || el.value.replace(/\s/g, "") == "") {
        alert(name + "을(를) 입력하세요.");
        el.focus();
        return false;
    }
    return true;
}

function fnNumeric(el, name) {
    if (!/^[0-9]+$/.test(el.value)) {
        alert(name + "은(는) 숫자만 입력할 수 있습니다.");
        el.focus();
        el.select();
        return false;
    }
    return true;
}

// 금액 포맷 : 000000001150000 → 1,150,000
function fnAmountFormat(amt) {
    if (!amt) return "0";
    
    // 앞의 0 제거
    var num = String(Number(amt));
    
    // 3자리마다 콤마
    return num.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}


// 4. 성공 처리
function fnSuccess(res) {
    document.getElementById("result").innerText =
        "응답코드   : " + res.resCode + "\n" +
        "응답메시지 : " + res.resMsg + "\n" +
		"거래후잔액 : " + fnAmountFormat(res.balance) + "원\n" +
	    "거래번호   : " + res.trNo;
}

</script>

</body>
</html>
