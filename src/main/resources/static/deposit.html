<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>입금</title>
    <script src="/common.js"></script>
</head>
<body>

<div id="header" style="padding:8px; background:#eee; margin-bottom:12px;"></div>
<h2>입금</h2>

<div>
    <label>은행</label>
    <select id="bankCode"></select>
</div>

<div>
    <label>계좌번호</label>
    <input type="text" id="acctNo" value="1234567890">
</div>

<div>
    <label>고객명</label>
    <input type="text" id="custNm" value="홍길동">
</div>

<div>
    <label>입금금액</label>
    <input type="text" id="amount" value="150000">
</div>

<br>
<button onclick="fnConfirm()">확인</button>

<hr>

<div id="result"></div>

<script>
function fnConfirm() {

    // 1. 입력값 검증
    if (!fnValidate()) return;

    // 2. 값 꺼내기
    var param = {
        bankCode : document.getElementById("bankCode").value,
        acctNo : document.getElementById("acctNo").value,
        custNm : document.getElementById("custNm").value,
        amount : document.getElementById("amount").value
    };

    // 3. 서버 호출
    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/deposit", true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
    fnHandleRes(xhr, function(data) {
    fnSuccess(data);
        });
    };

    xhr.send(JSON.stringify(param));
}


// ★ 화면 검증
function fnValidate() {

    var bankCode = document.getElementById("bankCode");
    var acctNo = document.getElementById("acctNo");
    var custNm = document.getElementById("custNm");
    var amount = document.getElementById("amount");

    if (!bankCode.value) {
        alert("은행 목록을 불러오지 못했습니다. 새로고침 후 다시 시도하세요.");
        return false;
    }
    if (!fnRequired(acctNo, "계좌번호")) return false;
    if (!fnNumeric(acctNo, "계좌번호"))  return false;

    if (!fnRequired(custNm, "고객명"))   return false;

    if (!fnRequired(amount, "입금금액")) return false;
    if (!fnNumeric(amount, "입금금액"))  return false;

    if (Number(amount.value) <= 0) {
        alert("입금금액은 0보다 커야 합니다.");
        amount.focus();
        return false;
    }

    return true;
}

function fnRequired(el, name) {
    if (el.value == null || el.value.replace(/\s/g, "") == "") {
        alert(name + "을(를) 입력하세요.");
        el.focus();
        return false;
    }
    return true;
}

function fnNumeric(el, name) {
    if (!/^[0-9]+$/.test(el.value)) {
        alert(name + "은(는) 숫자만 입력할 수 있습니다.");
        el.focus();
        el.select();
        return false;
    }
    return true;
}


// 3. 성공 처리
function fnSuccess(res) {
    document.getElementById("result").innerText =
        "응답코드   : " + res.resCode + "\n" +
        "응답메시지 : " + res.resMsg + "\n" +
		"거래후잔액 : " + fnAmountFormat(res.balance) + "원\n" +
	    "거래번호   : " + res.trNo;
}

// 화면이 열릴 때 실행
window.onload = function() {
    fnCheckSession(function() {
        fnLoadCode("BANK", "bankCode");
    });
};






</script>

</body>
</html>
