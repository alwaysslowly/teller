<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>출금</title>
<script src="/common.js"></script>
<style>
    body { font-family: 맑은 고딕; font-size: 13px; }
    table { border-collapse: collapse; margin-top: 10px; }
    th, td { border: 1px solid #999; padding: 6px 10px; }
    th { background: #eee; width: 100px; }
</style>
</head>
<body>

<div id="header" style="padding:8px; background:#eee; margin-bottom:12px;"></div>

<h3>출금</h3>

<table>
    <tr><th>계좌번호</th><td><input type="text" id="acctNo" value="1234567890"></td></tr>
    <tr><th>비밀번호</th><td><input type="password" id="passwd" maxlength="4"></td></tr>
    <tr><th>출금금액</th><td><input type="text" id="amount" value="500000"></td></tr>
</table>
<br>
<button onclick="fnConfirm()">확인</button>

<hr>
<div id="result"></div>

<script>

window.onload = function() {
    fnCheckSession();
};


function fnConfirm() {

    if (!fnValidate()) return;

    var param = {
        acctNo : document.getElementById("acctNo").value,
        passwd : document.getElementById("passwd").value,
        amount : document.getElementById("amount").value
    };

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/withdraw", true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
        fnHandleRes(xhr, function(data) {
            document.getElementById("result").innerText =
                "출금이 완료되었습니다.\n" +
                "거래후잔액 : " + fnAmountFormat(data.balance) + "원\n" +
                "거래번호   : " + data.trNo;

            document.getElementById("passwd").value = "";   // ★ 비밀번호 지우기
        });
    };

    xhr.send(JSON.stringify(param));
}


function fnValidate() {

    var acctNo = document.getElementById("acctNo");
    var passwd = document.getElementById("passwd");
    var amount = document.getElementById("amount");

    if (!acctNo.value) { alert("계좌번호를 입력하세요."); acctNo.focus(); return false; }
    if (!/^[0-9]+$/.test(acctNo.value)) {
        alert("계좌번호는 숫자만 입력할 수 있습니다.");
        acctNo.focus(); acctNo.select(); return false;
    }

    if (!passwd.value) { alert("비밀번호를 입력하세요."); passwd.focus(); return false; }
    if (passwd.value.length != 4) {
        alert("비밀번호는 4자리입니다.");
        passwd.focus(); passwd.select(); return false;
    }

    if (!amount.value) { alert("출금금액을 입력하세요."); amount.focus(); return false; }
    if (!/^[0-9]+$/.test(amount.value)) {
        alert("출금금액은 숫자만 입력할 수 있습니다.");
        amount.focus(); amount.select(); return false;
    }
    if (Number(amount.value) <= 0) {
        alert("출금금액은 0보다 커야 합니다.");
        amount.focus(); return false;
    }

    return true;
}

</script>

</body>
</html>
