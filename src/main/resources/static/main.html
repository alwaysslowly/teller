<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>통합단말</title>
<script src="/common.js"></script>
<style>
    body { font-family: 맑은 고딕; font-size: 13px; }
    .menu { margin-top: 20px; }
    .menu a {
        display: block;
        width: 220px;
        padding: 12px 16px;
        margin-bottom: 8px;
        border: 1px solid #999;
        background: #f8f8f8;
        text-decoration: none;
        color: #222;
    }
    .menu a:hover { background: #e8eef4; }
</style>
</head>
<body>

<div id="header" style="padding:8px; background:#eee; margin-bottom:12px;"></div>

<h3>업무 메뉴</h3>

<div class="menu" id="menuArea"></div>

<script>

window.onload = function() {
    fnCheckSession(function() {
        fnLoadMenu();
    });
};


function fnLoadMenu() {

    var xhr = new XMLHttpRequest();
    xhr.open("GET", "/menu", true);

    xhr.onload = function() {
        fnHandleRes(xhr, function(list) {

            var area = document.getElementById("menuArea");
            area.innerHTML = "";

            if (list.length == 0) {
                area.innerText = "사용 가능한 메뉴가 없습니다.";
                return;
            }

            for (var i = 0; i < list.length; i++) {
                var a = document.createElement("a");
                a.href = list[i].menuUrl;
                a.innerText = list[i].menuNm;
                area.appendChild(a);
            }
        });
    };

    xhr.send();
}

</script>

</body>
</html>
