<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거래내역조회</title>
    <style>
        body { font-family: 맑은 고딕; font-size: 13px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #999; padding: 5px 10px; }
        th { background: #eee; }
        .num { text-align: right; }
        .center { text-align: center; }
    </style>
</head>
<body>

<h3>거래내역조회</h3>

<div>
    계좌번호 <input type="text" id="acctNo" value="1234567890">
    조회기간 <input type="text" id="fromDate" value="20260901">
    ~ <input type="text" id="toDate" value="20260910">
    <button onclick="fnSearch()">조회</button>
</div>

<div id="cntArea"></div>

<table id="grid">
    <thead>
        <tr>
            <th>일자</th>
            <th>시간</th>
            <th>적요</th>
            <th>거래금액</th>
            <th>거래후잔액</th>
        </tr>
    </thead>
    <tbody id="gridBody">
    </tbody>
</table>

<script>

function fnSearch() {

    var param = {
        acctNo   : document.getElementById("acctNo").value,
        fromDate : document.getElementById("fromDate").value,
        toDate   : document.getElementById("toDate").value
    };

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/history", true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
        if (xhr.status == 200) {
            var res = JSON.parse(xhr.responseText);
            fnSetGrid(res);
        } else {
            alert("오류가 발생했습니다.");
        }
    };

    xhr.send(JSON.stringify(param));
}


// ★ 그리드에 목록 뿌리기
function fnSetGrid(res) {

    var tbody = document.getElementById("gridBody");
    tbody.innerHTML = "";                 // 기존 내용 지우기

    var list = res.list;

    for (var i = 0; i < list.length; i++) {

        var item = list[i];
        var tr = document.createElement("tr");

        tr.innerHTML =
            "<td class='center'>" + fnDateFormat(item.trDate) + "</td>" +
            "<td class='center'>" + fnTimeFormat(item.trTime) + "</td>" +
            "<td>" + item.summary + "</td>" +
            "<td class='num'>" + fnAmountFormat(item.amount) + "</td>" +
            "<td class='num'>" + fnAmountFormat(item.balance) + "</td>";

        tbody.appendChild(tr);
    }

    document.getElementById("cntArea").innerText = "총 " + res.totalCount + "건";
}


// ===== 표시용 변환 =====

function fnAmountFormat(amt) {
    if (!amt) return "0";
    var num = String(Number(amt));
    return num.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function fnDateFormat(dt) {
    if (!dt || dt.length != 8) return dt;
    return dt.substr(0,4) + "-" + dt.substr(4,2) + "-" + dt.substr(6,2);
}

function fnTimeFormat(tm) {
    if (!tm || tm.length != 6) return tm;
    return tm.substr(0,2) + ":" + tm.substr(2,2) + ":" + tm.substr(4,2);
}

</script>

</body>
</html>
