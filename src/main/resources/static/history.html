<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <title>거래내역조회</title>
    <style>
        body { font-family: 맑은 고딕; font-size: 13px; }
        table { border-collapse: collapse; margin-top: 10px; }
        th, td { border: 1px solid #999; padding: 5px 10px; }
        th { background: #eee; }
        .num { text-align: right; }
        .center { text-align: center; }
        tbody tr { cursor: pointer; }
        tbody tr:hover { background: #f5f5f5; }
        tbody tr.on { background: #dde8f0; }
    </style>
</head>
<body>

<h3>거래내역조회</h3>

<div>
    계좌번호 <input type="text" id="acctNo" value="1234567890">
    조회기간 <input type="text" id="fromDate" value="20260901">
    ~ <input type="text" id="toDate" value="20260910">
    <button onclick="fnSearch()">조회</button>
</div>

<div id="cntArea"></div>

<table id="grid">
    <thead>
        <tr>
            <th>일자</th>
            <th>시간</th>
            <th>적요</th>
            <th>거래금액</th>
            <th>거래후잔액</th>
        </tr>
    </thead>
    <tbody id="gridBody">
    </tbody>
</table>

<div id="detail" style="margin-top:18px; display:none;">
    <b>선택한 거래</b>
    <table style="margin-top:6px;">
        <tr><th>거래일시</th><td id="dtDate"></td></tr>
        <tr><th>적요</th><td id="dtSummary"></td></tr>
        <tr><th>거래금액</th><td class="num" id="dtAmount"></td></tr>
        <tr><th>거래후잔액</th><td class="num" id="dtBalance"></td></tr>
    </table>
</div>

<script>

var gList = [];   // 조회된 거래내역 목록

function fnSearch() {

    var param = {
        acctNo   : document.getElementById("acctNo").value,
        fromDate : document.getElementById("fromDate").value,
        toDate   : document.getElementById("toDate").value
    };

    var xhr = new XMLHttpRequest();
    xhr.open("POST", "/history", true);
    xhr.setRequestHeader("Content-Type", "application/json");

    xhr.onload = function() {
    if (xhr.status != 200) {
        alert("서버 통신에 실패했습니다.");
        return;
    }
    var res = JSON.parse(xhr.responseText);
    if (!res.success) {
        alert(res.message + "\n(" + res.code + ")");
        return;
    }
    fnSetGrid(res.data);
};

    xhr.send(JSON.stringify(param));
}


// ★ 그리드에 목록 뿌리기
function fnSetGrid(data) {

    var tbody = document.getElementById("gridBody");
    tbody.innerHTML = "";
    document.getElementById("detail").style.display = "none";

    gList = data.list;                    // ★ 목록 보관

    for (var i = 0; i < gList.length; i++) {

        var item = gList[i];
        var tr = document.createElement("tr");

        tr.innerHTML =
            "<td class='center'>" + fnDateFormat(item.trDate) + "</td>" +
            "<td class='center'>" + fnTimeFormat(item.trTime) + "</td>" +
            "<td>" + item.summary + "</td>" +
            "<td class='num'>" + fnAmountFormat(item.amount) + "</td>" +
            "<td class='num'>" + fnAmountFormat(item.balance) + "</td>";

        tr.onclick = fnRowClick(i);       // ★ 행 클릭 연결

        tbody.appendChild(tr);
    }

    document.getElementById("cntArea").innerText = "총 " + data.totalCount + "건";
}


// ===== 표시용 변환 =====

function fnAmountFormat(amt) {
    if (!amt) return "0";
    var num = String(Number(amt));
    return num.replace(/\B(?=(\d{3})+(?!\d))/g, ",");
}

function fnDateFormat(dt) {
    if (!dt || dt.length != 8) return dt;
    return dt.substr(0,4) + "-" + dt.substr(4,2) + "-" + dt.substr(6,2);
}

function fnTimeFormat(tm) {
    if (!tm || tm.length != 6) return tm;
    return tm.substr(0,2) + ":" + tm.substr(2,2) + ":" + tm.substr(4,2);
}

// ★ 행 클릭
function fnRowClick(rowIdx) {
    return function() {

        // 선택 표시
        var rows = document.getElementById("gridBody").children;
        for (var i = 0; i < rows.length; i++) {
            rows[i].className = "";
        }
        rows[rowIdx].className = "on";

        // 상세 채우기
        var item = gList[rowIdx];

        document.getElementById("dtDate").innerText =
            fnDateFormat(item.trDate) + " " + fnTimeFormat(item.trTime);
        document.getElementById("dtSummary").innerText = item.summary;
        document.getElementById("dtAmount").innerText  = fnAmountFormat(item.amount) + "원";
        document.getElementById("dtBalance").innerText = fnAmountFormat(item.balance) + "원";

        document.getElementById("detail").style.display = "";
    };
}




</script>

</body>
</html>
